[package]
name = "fs_tree_shared"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
metadata_timestamps = []
metadata_ownership = []
full_metadata = ["metadata_timestamps", "metadata_ownership"]
ignore_zero = []
count_files = []

[dependencies]
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
