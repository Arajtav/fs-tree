[package]
name = "fs_tree_app"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.23.1"
clap = { version = "4.5.41", features = ["derive"] }
phf = { version = "0.12.1", features = ["macros"] }
pollster = "0.4.0"
wgpu = "26.0.1"
winit = "0.30.11"
fs_tree_shared = { path = "../shared", features = ["metadata_timestamps", "ignore_zero", "count_files"] }
fontdb = "0.23.0"
glyph_brush = "0.7.12"
ab_glyph = "0.2.31"
wgpu_text = "26.0.0"
open = "5.3.2"

[target.'cfg(target_family = "unix")'.dependencies]
fs_tree_shared = { path = "../shared", features = ["metadata_ownership"] }
nix = { version = "0.30.1", features = ["user"] }
