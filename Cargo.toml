[package]
name = "fs_tree"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.23.1"
clap = { version = "4.5.40", features = ["derive"] }
phf = { version = "0.12.1", features = ["macros"] }
pollster = "0.4.0"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
wgpu = "26.0.1"
winit = "0.30.11"

[build-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"

[features]
full_metadata = []

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"
