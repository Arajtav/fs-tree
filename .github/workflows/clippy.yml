on: push
name: Clippy check

env:
    RUSTFLAGS: "-Dwarnings"

jobs:
    clippy_check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "rust-ci-cache"

            - name: Run Clippy
              run: cargo clippy --all-targets --all-features
